<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>跟练计数器</title>
<style>
  :root{--bg:#111418;--card:#1C2128;--card2:#232A33;--ink:#F2F4F6;--ink2:#9AA6B2;--line:#2C343E;
    --green:#5DCAA5;--green-d:#0F6E56;--blue:#5B9BD5;--red:#E24B4A}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;
    min-height:100vh;max-width:520px;margin:0 auto;padding:16px 14px 40px;user-select:none}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{font-size:12px;color:var(--ink2);margin-bottom:18px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .ex{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:none}
  .ex .n{flex:1;min-width:0}
  .ex .n b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ex .n span{font-size:11px;color:var(--ink2)}
  .no{font-size:11px;color:var(--ink2)}
  button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
  .btn{background:var(--green-d);color:#EAF7F2;border-radius:12px;padding:14px;font-size:15px;font-weight:600;width:100%}
  .btn:active{opacity:.75}
  .btn.sub2{background:var(--card2);color:var(--ink2);font-size:13px;padding:11px}
  .mini{background:var(--card2);border:1px solid var(--line);color:var(--green);border-radius:9px;
    padding:9px 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
  .mini.gray{color:var(--ink2)}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper b{min-width:30px;text-align:center;font-size:15px}
  .stepper button{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
  .stepper button::before,.stepper button.plus::after{content:'';position:absolute;left:50%;top:50%;background:var(--green);transform:translate(-50%,-50%)}
  .stepper button::before{width:12px;height:2px}
  .stepper button.plus::after{width:2px;height:12px}
  .row{display:flex;gap:8px}
  input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    padding:10px 12px;font-size:14px;width:100%;font-family:inherit}
  #session,#summary{display:none}
  #session{position:fixed;inset:0;z-index:1;background:#000}
  #session.on{display:block}
  #stage{position:absolute;inset:0;background:#000}
  #vid{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .quit{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:4;
    color:#FF8A80;font-size:13px;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:9px}
  #bigOvl{position:absolute;left:0;right:0;bottom:104px;z-index:3;text-align:center;pointer-events:none}
  #big .r{font-size:50px;font-weight:600;line-height:1.1;color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
  #big .s{font-size:13px;color:rgba(255,255,255,.85);margin-top:4px;line-height:1.7;
    text-shadow:0 1px 5px rgba(0,0,0,.9)}
  .ctl{position:absolute;left:14px;right:14px;bottom:26px;z-index:3}
  .ctl .btn{background:rgba(200,40,40,.92)}
  #pauseOvl{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;pointer-events:none}
  #pauseOvl span{background:rgba(0,0,0,.6);color:#fff;font-size:15px;font-weight:600;
    padding:12px 22px;border-radius:14px;letter-spacing:1px}
  #rest{position:fixed;inset:0;background:rgba(10,13,16,.97);display:none;z-index:50;
    flex-direction:column;align-items:center;justify-content:center}
  .ring{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--green) var(--p,0%),#232A33 0)}
  .ring div{width:158px;height:158px;border-radius:50%;background:#111418;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .ring .sec{font-size:48px;font-weight:600;font-variant-numeric:tabular-nums}
  .ring .lab{font-size:12px;color:var(--ink2)}
  #restNext{margin-top:18px;font-size:13px;color:var(--ink2);text-align:center;line-height:1.9}
  #restNext b{color:var(--ink)}
  .rbtns{display:flex;gap:10px;margin-top:22px}
  .rbtns button{padding:12px 22px;border-radius:12px;font-size:14px;background:var(--card2);color:var(--ink2)}
  .rbtns .p{background:var(--green-d);color:#EAF7F2;font-weight:600}
  .srow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow b{font-size:14px}
  .srow span{font-size:12px;color:var(--ink2)}
  .srow .v{font-size:14px;color:var(--green);font-weight:600}
  #err{color:var(--red);font-size:12px;margin-top:8px;display:none;line-height:1.6}
  #wx{position:fixed;inset:0;background:rgba(10,13,16,.98);z-index:99;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:32px}
  #wx .t{font-size:19px;font-weight:600;margin-bottom:14px}
  #wx p{font-size:14px;color:var(--ink2);line-height:2}
</style>
</head>
<body>

<!-- 配置页 -->
<div id="setup">
  <h1>跟练计数器</h1>
  <p class="sub">每个动作一段短视频（可选）。设好组数和组间休息，开始后全程免操作：播完一遍视频 = 一组，自动休息，自动下一组。</p>
  <div class="card">
    <div id="exList"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="exName" placeholder="动作名称（可不填，自动编号）">
    </div>
    <div class="row" style="margin-top:8px">
      <button class="mini" id="pickBtn" style="flex:1">📁 选视频（可选）</button>
      <button class="mini" id="addBtn" style="flex:1;font-weight:600">+ 添加动作</button>
    </div>
    <div id="pending" style="font-size:11px;color:var(--green);margin-top:8px;display:none"></div>
    <div id="err"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px">
      <span style="font-size:13px;color:var(--ink2)">新动作默认组数</span>
      <div class="stepper">
        <button data-d="-1" aria-label="减少"></button><b id="defSets">3</b><button data-d="1" class="plus" aria-label="增加"></button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px 2px;border-top:1px solid var(--line)">
      <span style="font-size:13px;color:var(--ink2)">默认组间休息</span>
      <div class="stepper">
        <button data-r="-15" aria-label="减少"></button><b id="restDef">60s</b><button data-r="15" class="plus" aria-label="增加"></button>
      </div>
    </div>
  </div>
  <button class="btn sub2" id="applyAll" style="margin-bottom:10px">把默认组数和休息统一应用到全部动作</button>
  <button class="btn" id="startBtn">开始跟练 →</button>
  <button class="btn sub2" id="clearBtn" style="margin-top:8px">清空全部</button>
</div>

<!-- 跟练页：全屏视频 + 浮层 -->
<div id="session">
  <div id="stage"><video id="vid" playsinline></video></div>
  <button class="quit" id="quitBtn">结束</button>
  <div id="pauseOvl"><span>已暂停 · 轻点继续</span></div>
  <div id="bigOvl"><div id="big">
    <div class="r" id="bigNum"></div>
    <div class="s" id="bigSub"></div>
  </div></div>
  <div class="ctl">
    <button class="btn" id="doneBtn">本组完成</button>
  </div>
</div>

<!-- 休息层 -->
<div id="rest">
  <div class="ring" id="ring"><div><div class="sec" id="rSec">60</div><div class="lab">休息剩余</div></div></div>
  <div id="restNext"></div>
  <div class="rbtns"><button id="addT">+15s</button><button id="skipR" class="p">跳过休息</button></div>
</div>

<!-- 总结页 -->
<div id="summary">
  <h1>训练完成</h1>
  <p class="sub" style="margin-top:6px">今日全部组数已完成。</p>
  <div class="card" id="sumList"></div>
  <button class="btn" id="homeBtn">返回首页</button>
</div>

<!-- 微信提示已移除 -->

<input type="file" id="exVideo" accept="video/*" style="display:none">

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function showErr(t){const e=$('err');if(e){e.style.display=t?'block':'none';e.textContent=t}}

if(/MicroMessenger/i.test(navigator.userAgent)){
  // 微信内直接使用，不再显示提示横幅
}

// ---------- 数据 ----------
let exercises=[];        // {name, sets, rest, blob, url}
let restDefault=60, defaultSets=3, pendingVideo=null;

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('fitcount',2);
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('vids')}catch(e){}};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{
  const t=db.transaction('vids','readwrite');t.objectStore('vids').put(v,k);
  t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
async function idbDel(k){try{const db=await idb();await new Promise(res=>{
  const t=db.transaction('vids','readwrite');t.objectStore('vids').delete(k);t.oncomplete=res})}catch(e){}}
async function idbAll(){try{const db=await idb();return await new Promise(res=>{
  const t=db.transaction('vids','readonly');const s=t.objectStore('vids');
  const keys=[],vals=[];
  let done=0;
  const kc=s.count();
  kc.onsuccess=()=>{if(kc.result===0){res({keys,vals})}};
  const kr=s.openKeyCursor();
  kr.onsuccess=()=>{const c=kr.result;if(!c)return;keys.push(c.key);c.continue()};
  const gr=s.getAll();
  gr.onsuccess=()=>{vals.push(...gr.result);done++;if(done>=1&&keys.length===vals.length)res({keys,vals})};
  setTimeout(()=>res({keys,vals}),300);
})}catch(e){return{keys:[],vals:[]}}}
async function idbClear(){try{const db=await idb();await new Promise(res=>{
  const t=db.transaction('vids','readwrite');t.objectStore('vids').clear();t.oncomplete=res})}catch(e){}}

function saveMeta(){localStorage.setItem('fc_meta',JSON.stringify({
  rest:restDefault,dsets:defaultSets,ex:exercises.map(e=>({name:e.name,sets:e.sets,rest:e.rest,res:e.res||''}))}))}

async function loadAll(){
  try{
    const m=JSON.parse(localStorage.getItem('fc_meta')||'null');
    if(m&&m.ex){
      restDefault=m.rest||60;defaultSets=m.dsets||3;
      const {keys,vals}=await idbAll();
      const map={};keys.forEach((k,i)=>{map[k]=vals[i]});
      m.ex.forEach(e=>{
        const b=map[e.name];
        exercises.push({name:e.name,sets:e.sets,rest:e.rest,res:e.res||'',blob:b||null,url:b?URL.createObjectURL(b):null});
      });
    }
  }catch(e){}
  $('restDef').textContent=restDefault+'s';
  $('defSets').textContent=defaultSets;
  renderList();
}

// ---------- 配置页事件 ----------
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{
  defaultSets=Math.max(1,defaultSets+parseInt(b.dataset.d,10));
  $('defSets').textContent=defaultSets;saveMeta();}));
document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{
  restDefault=Math.max(0,restDefault+parseInt(b.dataset.r,10));
  $('restDef').textContent=restDefault+'s';saveMeta();}));

$('applyAll').addEventListener('click',()=>{
  if(!exercises.length){showErr('还没有动作');return}
  exercises.forEach(e=>{e.sets=defaultSets;e.rest=restDefault});saveMeta();renderList();});

$('exVideo').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  pendingVideo=f;
  const p=$('pending');
  p.style.display='block';
  p.textContent='已选视频：'+f.name+'（点"添加动作"入列）';
  $('pickBtn').textContent='📁 已选视频，可改选';
  e.target.value='';
});
$('pickBtn').addEventListener('click',()=>{showErr('');$('exVideo').click()});
$('addBtn').addEventListener('click',async()=>{
  let name=$('exName').value.trim();
  if(!name)name='动作'+(exercises.length+1);   // 名字可不填，自动编号
  if(exercises.some(x=>x.name===name)){showErr('已有同名动作（'+name+'），填个别的名字或留空自动编号');return}
  const res=pendingVideo?await vidRes(pendingVideo):'';
  const ex={name,sets:defaultSets,rest:restDefault,res,blob:pendingVideo,url:pendingVideo?URL.createObjectURL(pendingVideo):null};
  exercises.push(ex);
  if(pendingVideo)await idbSet(name,pendingVideo);
  saveMeta();
  $('exName').value='';pendingVideo=null;
  $('pending').style.display='none';$('pickBtn').textContent='📁 选视频（可选）';
  showErr('');renderList();
});
// 读取视频原始分辨率（原文件逐字节保存，不经过任何压缩，这里只是读取信息）
function vidRes(f){return new Promise(res=>{
  const v=document.createElement('video');v.preload='metadata';
  v.onloadedmetadata=()=>{const r=v.videoWidth+'x'+v.videoHeight;URL.revokeObjectURL(v.src);res(r)};
  v.onerror=()=>res('');
  v.src=URL.createObjectURL(f);
})}
$('clearBtn').addEventListener('click',async()=>{
  exercises=[];await idbClear();localStorage.removeItem('fc_meta');renderList();});
$('startBtn').addEventListener('click',()=>{
  if(!exercises.length){showErr('至少添加一个动作');return}
  startSession();
});

function renderList(){
  const list=$('exList');
  list.innerHTML='';
  if(!exercises.length){
    list.innerHTML='<div style="font-size:12px;color:var(--ink2);padding:8px 0">还没有动作，在下方添加（视频可选，无视频则手动点完成计组）</div>';
    $('startBtn').textContent='开始跟练 →';
    return;
  }
  exercises.forEach((e,i)=>{
    const d=document.createElement('div');d.className='ex';
    d.innerHTML=`<span class="no">${i+1}</span>
      <div class="n"><b>${esc(e.name)}</b><span>${e.url?('有视频'+(e.res?' · 原画 '+e.res:'')):'无视频·手动完成'}</span></div>
      <span class="no">组数</span>
      <div class="stepper">
        <button data-s="-1" data-i="${i}" aria-label="减少"></button><b>${e.sets}</b><button data-s="1" data-i="${i}" class="plus" aria-label="增加"></button>
      </div>
      <span class="no">休息</span>
      <div class="stepper">
        <button data-rs="-15" data-i="${i}" aria-label="减少"></button><b>${e.rest}s</b><button data-rs="15" data-i="${i}" class="plus" aria-label="增加"></button>
      </div>
      <button class="mini gray" data-x="${i}">删</button>`;
    list.appendChild(d);
  });
  const t=exercises.reduce((a,x)=>a+x.sets,0);
  const d=document.createElement('div');
  d.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding-top:11px';
  d.innerHTML=`<b style="font-size:14px">合计</b>
    <span style="font-size:12px;color:var(--ink2)">${exercises.length} 个动作</span>
    <div style="font-size:15px;font-weight:600">共 ${t} 组</div>`;
  list.appendChild(d);
  $('startBtn').textContent=`开始跟练（共 ${t} 组） →`;
}
$('exList').addEventListener('click',async ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.s!==undefined){
    const e=exercises[parseInt(b.dataset.i,10)];
    e.sets=Math.min(20,Math.max(1,e.sets+parseInt(b.dataset.s,10)));
    saveMeta();renderList();
  }else if(b.dataset.rs!==undefined){
    const e=exercises[parseInt(b.dataset.i,10)];
    e.rest=Math.min(600,Math.max(0,e.rest+parseInt(b.dataset.rs,10)));
    saveMeta();renderList();
  }else if(b.dataset.x!==undefined){
    const i=parseInt(b.dataset.x,10);
    await idbDel(exercises[i].name);
    exercises.splice(i,1);
    saveMeta();renderList();
  }
});

// ---------- 音频 ----------
let AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d,v){if(!AC)return;try{
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.type='sine';g.gain.value=v||.25;
  o.connect(g);g.connect(AC.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.12));
  o.stop(AC.currentTime+(d||.12));
}catch(e){}}

// ---------- 会话 ----------
let S={idx:0,set:1,phase:'idle'};
let results=[],restTimer=null,restLeft=0,restTotal=0,setStart=0;
let wakeLock=null,manualTimer=null,pendingAfter=null;

function cur(){return exercises[S.idx]}
function totalSets(){return exercises.reduce((a,e)=>a+e.sets,0)}
function doneSets(){let n=0;for(let i=0;i<S.idx;i++)n+=exercises[i].sets;return n+S.set-1}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return m>0?`${m}分${String(ss).padStart(2,'0')}秒`:`${ss}秒`}

function startSession(){
  initAudio();
  $('setup').style.display='none';$('summary').style.display='none';
  $('session').style.display='block';
  results=exercises.map(e=>({name:e.name,secs:[]}));
  S={idx:0,set:1,phase:'idle'};
  if(navigator.wakeLock){navigator.wakeLock.request('screen').then(w=>{wakeLock=w}).catch(()=>{})}
  loadExercise();
}
function loadExercise(){
  const e=cur();
  if(e.url){
    $('vid').src=e.url;$('vid').style.display='block';
    // 竖版视频铺满全屏（cover）；横版视频保持完整（contain），避免左右被裁太多
    $('vid').onloadedmetadata=()=>{
      const r=$('vid').videoWidth/$('vid').videoHeight;
      $('vid').style.objectFit=(r&&r>1)?'contain':'cover';
    };
  }
  else{$('vid').removeAttribute('src');$('vid').style.display='none'}
  beginSet();
}
function beginSet(){
  S.phase='work';setStart=Date.now();
  $('pauseOvl').style.display='none';
  const e=cur();
  $('bigNum').textContent=`第 ${S.set} 组`;
  $('bigSub').textContent=`总第 ${Math.min(doneSets()+1,totalSets())}/${totalSets()} 组 · `+
    (e.url?'跟着视频练，播完自动算一组':'无视频：自己练，练完点下方完成');
  clearInterval(manualTimer);
  if(e.url){
    try{$('vid').currentTime=0}catch(x){}
    $('vid').onended=finishSet;
    $('vid').muted=false;
    const p=$('vid').play();
    if(p&&p.catch)p.catch(()=>{$('vid').muted=true;const q=$('vid').play();if(q&&q.catch)q.catch(()=>{})});
  }else{
    manualTimer=setInterval(()=>{
      $('bigNum').textContent=fmt(Math.round((Date.now()-setStart)/1000));
    },500);
  }
}
function finishSet(){
  if(S.phase!=='work')return;
  S.phase='rest';
  clearInterval(manualTimer);
  $('pauseOvl').style.display='none';
  try{$('vid').pause()}catch(e){}
  const secs=Math.max(1,Math.round((Date.now()-setStart)/1000));
  results[S.idx].secs.push(secs);
  const wasSet=S.set;S.set++;
  beep(740,.15,.3);
  const lastSet=wasSet>=cur().sets;
  const lastEx=S.idx>=exercises.length-1;
  if(lastSet&&lastEx){endSession();return}
  if(lastSet){
    startRest(()=>{S.idx++;S.set=1;loadExercise()},
      `下一个动作：<b>${esc(exercises[S.idx+1].name)}</b>`);
  }else{
    startRest(()=>{beginSet()},
      `下一组：<b>${esc(cur().name)} 第 ${wasSet+1} 组</b>`);
  }
}
$('doneBtn').addEventListener('click',finishSet);
$('quitBtn').addEventListener('click',()=>endSession(true));

// 轻点视频空白区域：暂停 / 继续
$('session').addEventListener('click',ev=>{
  if(ev.target.closest('button'))return;   // 按钮照常
  if(S.phase!=='work')return;
  const v=$('vid');
  if(!cur()||!cur().url||!v.src)return;
  if(v.paused){
    const p=v.play();if(p&&p.catch)p.catch(()=>{});
    $('pauseOvl').style.display='none';
  }else{
    v.pause();
    $('pauseOvl').style.display='flex';
  }
});

function startRest(after,label){
  pendingAfter=after;
  restLeft=cur().rest;restTotal=restLeft;
  if(restTotal<=0){   // 休息设为 0：不进倒计时，短暂停顿后直接下一组
    beep(740,.15,.3);
    setTimeout(()=>{const fn=pendingAfter;pendingAfter=null;if(fn)fn()},400);
    return;
  }
  $('rest').style.display='flex';
  $('restNext').innerHTML=label+`<br><span style="font-size:11px">总进度：已完成 ${doneSets()}/${totalSets()} 组</span>`;
  clearInterval(restTimer);
  const tick=()=>{
    $('rSec').textContent=Math.max(0,restLeft);
    $('ring').style.setProperty('--p',((restTotal-restLeft)/restTotal*100)+'%');
    if(restLeft<=3&&restLeft>0)beep(988,.1,.3);
    if(restLeft<=0){
      clearInterval(restTimer);
      beep(1319,.4,.35);
      $('rest').style.display='none';
      const fn=pendingAfter;pendingAfter=null;if(fn)fn();
      return;
    }
    restLeft--;
  };
  tick();
  restTimer=setInterval(tick,1000);
}
$('addT').addEventListener('click',()=>{restLeft+=15;if(restTotal<restLeft)restTotal=restLeft});
$('skipR').addEventListener('click',()=>{
  clearInterval(restTimer);
  $('rest').style.display='none';
  const fn=pendingAfter;pendingAfter=null;if(fn)fn();
});

function endSession(allowEmpty){
  const didAny=results&&results.some(r=>r.secs.length);
  if(!didAny&&!allowEmpty){return}
  S.phase='idle';
  clearInterval(restTimer);clearInterval(manualTimer);
  $('rest').style.display='none';
  try{$('vid').pause()}catch(e){}
  try{if(wakeLock)wakeLock.release()}catch(e){}
  if(!didAny){goHome();return}
  $('session').style.display='none';$('summary').style.display='block';
  let html='',n=0;
  results.forEach((r,i)=>{
    if(!r.secs.length)return;
    n+=r.secs.length;
    html+=`<div class="srow"><div><b>${i+1}. ${esc(r.name)}</b><br>
      <span>${r.secs.map((s,j)=>`第${j+1}组 ${fmt(s)}`).join('　')}</span></div>
      <div class="v">${r.secs.length} 组</div></div>`;
  });
  html+=`<div class="srow"><b>合计</b><span>${exercises.length} 个动作</span><div class="v">共 ${n} 组</div></div>`;
  $('sumList').innerHTML=html;
}
function goHome(){
  clearInterval(restTimer);clearInterval(manualTimer);
  $('rest').style.display='none';
  $('session').style.display='none';$('summary').style.display='none';
  $('setup').style.display='block';
  S.phase='idle';
}
$('homeBtn').addEventListener('click',goHome);

loadAll();
</script>
